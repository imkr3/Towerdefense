<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>막대 왕국 전쟁 3D 시험판</title>
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="style3d.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- 메뉴 -->
<section id="menu" class="scr active">
  <div class="menu-box">
    <h1>막대 왕국 전쟁 <b>3D</b></h1>
    <p class="sub">시험판 · 모든 병종 · 적 · 보스를 3D 로 · 전투는 본편과 같은 엔진</p>
    <div class="menu-btns">
      <button class="btn primary" data-go="stages">⚔ 전장</button>
      <button class="btn" data-go="events">✦ 도전</button>
      <button class="btn" data-go="deck">🛡 편성</button>
      <button class="btn" data-go="gallery">🧊 모델 도감</button>
      <a class="btn ghost" href="../index.html">← 2D 본편으로</a>
    </div>
    <label class="chk"><input type="checkbox" id="opt-all"> 모든 병종 체험 (해금 · 소환 무시)</label>
    <label class="chk"><input type="checkbox" id="opt-hq"> 고화질 (그림자 · 부드러운 가장자리)</label>
    <p class="note" id="save-note"></p>
  </div>
</section>

<!-- 전장 고르기 -->
<section id="stages" class="scr">
  <header><button class="btn sm" data-go="menu">←</button><h2 id="stages-title">전장</h2>
    <label class="chk" id="hard-wrap"><input type="checkbox" id="opt-hard"> 💀 하드코어</label></header>
  <div id="stage-list" class="list"></div>
</section>

<!-- 편성 -->
<section id="deck" class="scr">
  <header><button class="btn sm" data-go="menu">←</button><h2>편성 <small id="deck-count"></small></h2>
    <button class="btn sm" id="deck-clear">비우기</button></header>
  <p class="note">누르면 넣고 뺀다 (최대 10 · 전설/신화 2). 본편 저장에는 쓰지 않는다.</p>
  <div id="deck-pick" class="chips"></div>
  <div id="deck-list" class="chips"></div>
</section>

<!-- 도감 -->
<section id="gallery" class="scr">
  <header><button class="btn sm" data-go="menu">←</button><h2>모델 도감 <small id="gal-count"></small></h2>
    <input id="gal-search" placeholder="이름 찾기" autocomplete="off"></header>
  <div class="gal-tabs">
    <button class="btn sm on" data-gtab="all">전체</button><button class="btn sm" data-gtab="ally">아군</button>
    <button class="btn sm" data-gtab="enemy">적</button><button class="btn sm" data-gtab="boss">보스</button>
  </div>
  <div id="gal-list" class="list gal-list"></div>
  <div id="gal-info">
    <div id="gal-name"></div>
    <div id="gal-meta"></div>
    <div class="gal-anim">
      <button class="btn sm on" data-anim="idle">대기</button><button class="btn sm" data-anim="walk">걷기</button>
      <button class="btn sm" data-anim="attack">공격</button><button class="btn sm" data-anim="hit">맞음</button>
      <button class="btn sm" data-anim="die">쓰러짐</button>
    </div>
    <div class="gal-nav"><button class="btn sm" id="gal-prev">◀</button><button class="btn sm" id="gal-spin">⟳ 돌리기</button><button class="btn sm" id="gal-next">▶</button></div>
  </div>
</section>

<!-- 전투 -->
<section id="battle" class="scr">
  <div class="top">
    <div class="castle ally"><span>아군 성채</span><i><b id="hp-ally"></b></i></div>
    <div class="mid"><div id="b-stage"></div><div id="b-money"></div></div>
    <div class="castle enemy"><span>적 요새</span><i><b id="hp-enemy"></b></i></div>
  </div>
  <div class="ctrl">
    <button class="btn sm" id="b-speed">▶▶ 1x</button>
    <button class="btn sm" id="b-pause">⏸</button>
    <button class="btn sm" id="b-auto">자동</button>
    <button class="btn sm" id="b-cam">🎥 따라가기</button>
    <button class="btn sm" id="b-exit">나가기</button>
  </div>
  <div id="boss-bar" hidden><span id="boss-name"></span><i><b id="boss-hp"></b></i></div>
  <div id="announce"></div>
  <div id="numbers"></div>
  <div id="flash"></div>
  <div class="bottom">
    <button id="b-cmd" class="cmd"><span>👑 왕의 명령</span><i></i></button>
    <div id="cards"></div>
  </div>
  <div id="result" hidden>
    <div class="res-box">
      <h2 id="res-title"></h2>
      <p id="res-body"></p>
      <p class="note">시험판: 결과는 저장되지 않는다.</p>
      <div class="res-btns"><button class="btn primary" id="res-again">다시</button><button class="btn" id="res-back">전장 고르기</button></div>
    </div>
  </div>
  <div id="pause-cover" hidden>일시 정지 · 누르면 계속</div>
</section>

<div id="toast"></div>
<div id="boot">불러오는 중…</div>

<script src="../js/settings.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/data.js"></script>
<script src="../js/save-store.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script src="vendor/three.min.js"></script>
<script src="models.js"></script>
<script src="game3d.js"></script>
</body>
</html>
