plugins {
    id 'com.android.application'
}

/* 저장소 루트의 웹 게임 파일을 assets/www 로 복사한다.
 * 웹 버전과 APK 가 항상 같은 코드를 쓰도록 빌드 때마다 새로 복사한다. */
def webSrc = rootProject.file('..')
def webDst = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Sync) {
    description = '웹 게임 소스를 안드로이드 assets 로 복사'
    from(webSrc) {
        include 'index.html', 'manifest.json', 'icon.svg'
        include 'css/**', 'js/**'
    }
    into webDst
    // 서비스워커는 앱 안에서 필요 없다
    exclude 'sw.js'
}

tasks.register('cleanWebAssets', Delete) {
    delete webDst
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
    tasks.named('clean').configure { dependsOn 'cleanWebAssets' }
}

android {
    namespace 'com.stickkingdom.war'
    compileSdk 34

    defaultConfig {
        applicationId "com.stickkingdom.war"
        minSdk 26
        targetSdk 34
        versionCode 14001
        versionName "1.4.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // 사이드로드용: 릴리스도 디버그 키로 서명해 바로 설치할 수 있게 한다
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
