plugins {
    id 'com.android.application'
}

/* 저장소 루트의 웹 게임 파일을 assets/www 로 복사한다.
 * 웹 버전과 APK 가 항상 같은 코드를 쓰도록 빌드 때마다 새로 복사한다. */
def webSrc = rootProject.file('..')
def webDst = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Sync) {
    description = '웹 게임 소스를 안드로이드 assets 로 복사'
    from(webSrc) {
        include 'index.html', 'manifest.json', 'icon.svg'
        include 'css/**', 'js/**'
    }
    into webDst
    // 서비스워커는 앱 안에서 필요 없다
    exclude 'sw.js'
}

tasks.register('cleanWebAssets', Delete) {
    delete webDst
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
    tasks.named('clean').configure { dependsOn 'cleanWebAssets' }
}

android {
    namespace 'com.stickkingdom.war'
    compileSdk 34

    defaultConfig {
        applicationId "com.stickkingdom.war"
        minSdk 26
        targetSdk 34
        versionCode 19000
        versionName "1.9.0"
    }

    signingConfigs {
        stableRelease {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled false
            // 기존 설치의 서명 키를 재사용해야 진행도를 유지하며 업데이트할 수 있다.
            signingConfig signingConfigs.stableRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Never silently produce an incompatible release with an ephemeral debug key.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Release signing requires " + it)
        }
    }
}
