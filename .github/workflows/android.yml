name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: '릴리스로 배포할 버전 (예: 1.1.0). 비우면 아티팩트만 만든다'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    name: APK 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 디버그 APK 빌드
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: 릴리스 APK 빌드
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK 내용 검증
        run: |
          set -e
          DBG=android/app/build/outputs/apk/debug/app-debug.apk
          REL=android/app/build/outputs/apk/release/app-release.apk
          for f in "$DBG" "$REL"; do
            echo "== $f ($(du -h "$f" | cut -f1)) =="
            unzip -l "$f" | grep -E 'assets/www/(index.html|js/|css/)' || {
              echo "게임 파일이 APK 에 들어 있지 않다"; exit 1; }
          done
          echo "### APK 빌드 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 파일 | 크기 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| app-debug.apk | $(du -h "$DBG" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-release.apk | $(du -h "$REL" | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: 버전 이름 붙이기
        id: rename
        run: |
          VER="${{ github.event.inputs.release }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME}"
            case "$VER" in v*) VER="${VER#v}";; *) VER="$(date +%Y%m%d)-${GITHUB_SHA::7}";; esac
          fi
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/stick-kingdom-war-${VER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/stick-kingdom-war-${VER}-debug.apk"
          echo "version=$VER" >> $GITHUB_OUTPUT
          ls -lh dist

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: stick-kingdom-war-apk
          if-no-files-found: error
          path: dist/*.apk

      - name: 릴리스에 APK 첨부
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.release }}" ]; then
            TAG="v${{ github.event.inputs.release }}"
            TARGET="--target ${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
            TARGET=""
          fi
          echo "릴리스 태그: $TAG"
          gh release create "$TAG" dist/*.apk $TARGET \
            --title "막대 왕국 전쟁 ${{ steps.rename.outputs.version }}" \
            --notes-file .github/release-notes.md \
            || gh release upload "$TAG" dist/*.apk --clobber
          gh release view "$TAG" --json tagName,assets \
            --jq '"릴리스 " + .tagName + " 자산: " + ([.assets[].name] | join(", "))'
