name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: '배포할 버전. package.json 버전과 같아야 한다. 비우면 빌드만 한다.'
        required: false
        default: ''
  pull_request:
  push:
    branches:
      - 'claude/tower-defense-base-g4cj9z'
      - 'codex/gameplay-visual-polish'
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'package.json'
      - 'tools/**'
      - '.github/workflows/android.yml'
      - '.github/release-notes.md'

permissions:
  contents: write

jobs:
  build:
    name: APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 게임 검사
        run: npm test
      - name: 버전 검증
        id: version
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -n "$REQUESTED_RELEASE" ] && [ "$REQUESTED_RELEASE" != "$VER" ]; then
            echo '요청 버전과 package.json 버전이 다르다'; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo '태그와 APK 버전이 다르다'; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 개발용 APK 빌드 (기존 앱과 별도 설치)
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: 고정 서명 키 준비
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$CERT_SHA256" ]; then
            echo '기존 APK의 고정 서명 키 미설정: 업데이트 릴리스는 생성하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: 고정 키로 릴리스 빌드
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: APK 내용 및 서명 검증
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BUILDS=(debug)
          if [ "$SIGNING_READY" = true ]; then BUILDS+=(release); fi
          python3 tools/check-apk.py "${BUILDS[@]}"
          SDK_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          for BUILD in "${BUILDS[@]}"; do
            APK="android/app/build/outputs/apk/$BUILD/app-$BUILD.apk"
            "$SDK_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
            "$SDK_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
            head -1 "$RUNNER_TEMP/apk-badging.txt" | grep -F "versionName='$APP_VERSION'" | grep -F "versionCode='14002'"
            if [ "$BUILD" = release ]; then
              EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
              ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-cert.txt")
              [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] && [ "$ACTUAL" = "$EXPECTED" ]
              cp "$APK" "dist/stick-kingdom-war-$APP_VERSION.apk"
            else
              head -1 "$RUNNER_TEMP/apk-badging.txt" | grep -F "name='com.stickkingdom.war.dev'"
              cp "$APK" "dist/stick-kingdom-war-$APP_VERSION-dev.apk"
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: 서명 키 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: stick-kingdom-war-apk
          if-no-files-found: error
          path: dist/*
      - name: 기본 브랜치 버전 릴리스
        if: steps.signing.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release != '' && inputs.release != null || github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$APP_VERSION"
          # Published binaries are immutable; bump the version for a new release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 릴리스가 이미 있다. 기존 APK를 덮어쓰지 않는다."
            exit 0
          fi
          # gh 가 create 를 재시도하면 빈 릴리스 레코드가 하나 더 생기면서
          # "Published releases must have a valid tag" 422 로 끝난다.
          # 정작 자산이 붙은 릴리스는 멀쩡히 올라가 있으므로(v1.4.1 이 그랬다),
          # 실패했더라도 결과를 다시 확인해서 자산이 다 있으면 성공으로 본다.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "막대 왕국 전쟁 $APP_VERSION" \
            --notes-file .github/release-notes.md && exit 0
          echo "릴리스 생성이 오류로 끝났다. 실제 결과를 확인한다."
          UPLOADED=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name] | join(" ")' 2>/dev/null || true)
          echo "올라간 자산: ${UPLOADED:-없음}"
          for F in dist/*; do
            case " $UPLOADED " in
              *" $(basename "$F") "*) ;;
              *) echo "$(basename "$F") 가 릴리스에 없다"; exit 1 ;;
            esac
          done
          echo "자산이 모두 올라가 있다. 릴리스 성공으로 본다."

